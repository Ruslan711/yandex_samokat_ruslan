[pytest]
# --- Основные опции запуска ---
# -s: показывать print() в консоли, -v: подробный вывод
# --browser chromium / firefox — браузеры из ТЗ (chrome через chromium)
addopts = -sv --alluredir=allure-results --browser chromium --headed

# --- Пути и маркеры ---
testpaths = tests
markers =
    smoke: smoke tests
    regression: regression tests
