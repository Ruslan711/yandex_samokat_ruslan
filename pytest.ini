[pytest]
# --- Основные опции запуска ---
# -s: показывать print() в консоли, -v: подробный вывод
# Браузер и headed — свойство запуска (CLI), не проекта:
#   pytest --browser chromium --headed
#   pytest --browser firefox
addopts = -sv --alluredir=allure-results

# --- Пути и маркеры ---
testpaths = tests
markers =
    smoke: smoke tests
    regression: regression tests
