name: UI Tests Pipeline

"on":
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      TARGET_ENV:
        description: 'Выберите окружение для тестов'
        required: true
        default: 'dev'
        type: choice
        options: ['dev', 'stage']
      TEST_TYPE:
        description: 'Выберите тип тестов (по маркерам)'
        required: true
        default: 'all'
        type: choice
        options: ['smoke', 'regression', 'all']
      TEST_FILES:
        description: 'Список тестов через запятую (оставьте пустым для всех)'
        required: false
        type: string
      BROWSER_LIST:
        description: 'Браузеры для прогона'
        required: true
        default: 'chromium'
        type: choice
        options: ['chromium', 'firefox', 'webkit', 'all']

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  TARGET_ENV: ${{ github.event.inputs.TARGET_ENV || 'dev' }}
  TEST_TYPE: ${{ github.event.inputs.TEST_TYPE || 'all' }}
  TEST_FILES: ${{ github.event.inputs.TEST_FILES || '' }}
  BROWSER_LIST: ${{ github.event.inputs.BROWSER_LIST || 'chromium' }}

jobs:
  setup_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Настройка матрицы браузеров
        id: set-matrix
        run: |
          echo "Окружение: $TARGET_ENV | Тип тестов: $TEST_TYPE | Браузеры: $BROWSER_LIST"
          if [ "$BROWSER_LIST" = "all" ]; then
            echo 'matrix=["chromium", "firefox", "webkit"]' >> $GITHUB_OUTPUT
          else
            echo "matrix=[\"$BROWSER_LIST\"]" >> $GITHUB_OUTPUT
          fi

  testing:
    needs: setup_matrix
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.54.0-jammy
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJson(needs.setup_matrix.outputs.matrix) }}
    steps:
      - name: Чекаут кода
        uses: actions/checkout@v4

      - name: Установка зависимостей
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Запуск тестов
        run: |
          TEST_TARGETS="${TEST_FILES:-tests/}"
          TEST_TARGETS=$(echo "$TEST_TARGETS" | tr ',' ' ')
          MARKER_ARGS=""
          if [ "$TEST_TYPE" != "all" ]; then
            MARKER_ARGS="-m $TEST_TYPE"
          fi
          echo "Запуск тестов в ${{ matrix.browser }}..."
          pytest $TEST_TARGETS $MARKER_ARGS \
            --browser ${{ matrix.browser }} \
            --env=$TARGET_ENV \
            --alluredir=./allure-results \
            -v

      - name: Сохранение результатов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: ./allure-results
          retention-days: 5

  generate_allure_report:
    needs: testing
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Скачивание результатов тестов
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results-combined
          merge-multiple: true

      - name: Генерация Allure отчёта
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results-combined
          allure_report: allure-report

      - name: Подготовка к публикации Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  publish_to_pages:
    needs: generate_allure_report
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Деплой на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4